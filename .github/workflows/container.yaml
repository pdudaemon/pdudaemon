name: Publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:

env:
  DOCKER_TARGET_PLATFORMS: linux/amd64,linux/arm64

jobs:
  push_to_registry:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            pdudaemon/pdudaemon
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,suffix=-{{sha}},event=branch
            type=ref,suffix=-{{date 'YYYYMMDD'}},event=branch
            type=ref,event=tag
            type=ref,event=pr

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: pdudaemon-test
          cache-from: type=gha

      - name: Test Docker image
        run: |
          docker run -d --name pdudaemon-test -p 16421:16421 pdudaemon-test
          trap 'docker logs pdudaemon-test' EXIT
          for i in $(seq 30); do
            if curl -sf "http://localhost:16421/power/control/on?hostname=test&port=1"; then
              break
            fi
            sleep 1
          done
          for i in $(seq 30); do
            if docker exec pdudaemon-test grep -qx '1 on' /tmp/pdu; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.DOCKER_TARGET_PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
